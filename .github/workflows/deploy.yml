# Alternatywa dla Hostinger "Git deploy": push na main → FTP na hosting.
# Wymaga sekretów w repo: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (hPanel → Pliki → Konta FTP).
name: Deploy to Hostinger (FTP)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
