<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · UNNPC</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e0f0c">
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="../css/style.css?v=20260914">
  <link rel="stylesheet" href="../css/account.css?v=20260914">
</head>
<body>
<header class="nav is-scrolled" id="nav">
  <a class="nav__logo mono" href="/en/">&gt;_ UNNPC</a>
  <nav class="nav__links"><a href="/en/#modules">Modules</a><a href="/en/#pricing">Pricing</a><span id="navAccount"></span></nav>
  <a class="btn btn--acc btn--sm" href="/en/#pricing">Buy — $49</a>
</header>

<main class="acct">
  <section class="acct__card" id="loginCard">
    <span class="label">Player account</span>
    <h1>Sign in to your <span class="acc">library.</span></h1>
    <p>Use the same email you paid with. We’ll send a link — no password.</p>

    <button class="btn btn--line acct__google" id="googleBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.7-5.5 3.7-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3 14.7 2 12 2 6.5 2 2 6.5 2 12s4.5 10 10 10c5.8 0 9.6-4.1 9.6-9.8 0-.7-.1-1.2-.2-1.7H12z"/></svg>
      Continue with Google
    </button>
    <div class="acct__or label">or</div>

    <form class="acct__form" id="magicForm">
      <label class="sr-only" for="email">Email</label>
      <input id="email" type="email" placeholder="you@email.com" required autocomplete="email">
      <button class="btn btn--acc" type="submit">Send sign-in link</button>
    </form>
    <p class="acct__msg mono" id="msg" hidden></p>
    <p class="label">No products yet? <a href="/en/#pricing">See pricing</a> · <a href="/en/#tracker">Investor Tracker for $0</a></p>
  </section>
</main>

<footer class="footer label">
  <span>© 2026 UNNPC · unnpc.com</span>
  <nav><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><a href="refunds.html">Refunds</a><a href="mailto:[EMAIL_WSPARCIA]">Contact</a></nav>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js?v=20260914"></script>
<script src="../js/account.js?v=20260914"></script>
<script>
(async function () {
  const sb = window.UNNPC.sb;
  const msg = document.getElementById('msg');
  const say = (t, ok) => { msg.hidden = false; msg.textContent = t; msg.style.color = ok ? 'var(--acc)' : 'var(--danger)'; };
  const params = new URLSearchParams(location.search);
  const next = 'library.html';
  if (params.get('email')) document.getElementById('email').value = params.get('email');

  if (!sb) { say('Sign-in is not connected yet (missing Supabase config).', false); return; }

  const { data } = await sb.auth.getSession();
  if (data.session) { location.replace(next); return; }
  sb.auth.onAuthStateChange((ev, session) => { if (session) location.replace(next); });

  document.getElementById('magicForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + '/' + next } });
    if (error) say('Could not send the link: ' + error.message, false);
    else say('Link sent. Check your inbox (and spam) — valid for 1 hour.', true);
  });

  document.getElementById('googleBtn').addEventListener('click', async () => {
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/' + next } });
    if (error) say('Google: ' + error.message, false);
  });
})();
</script>
</body>
</html>
