<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaloguj się · UNNPC</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e0f0c">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20260914">
  <link rel="stylesheet" href="css/account.css?v=20260914">
</head>
<body>
<header class="nav is-scrolled" id="nav">
  <a class="nav__logo mono" href="/">&gt;_ UNNPC</a>
  <nav class="nav__links"><a href="/#moduly">Moduły</a><a href="/#cennik">Cennik</a><span id="navAccount"></span></nav>
  <a class="btn btn--acc btn--sm" href="/#cennik">Kup — 199 zł</a>
</header>

<main class="acct">
  <section class="acct__card" id="loginCard">
    <span class="label">Konto gracza</span>
    <h1>Zaloguj się do <span class="acc">biblioteki.</span></h1>
    <p>Użyj tego samego e-maila, którym płaciłeś. Wyślemy link — bez hasła.</p>

    <button class="btn btn--line acct__google" id="googleBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.7-5.5 3.7-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3 14.7 2 12 2 6.5 2 2 6.5 2 12s4.5 10 10 10c5.8 0 9.6-4.1 9.6-9.8 0-.7-.1-1.2-.2-1.7H12z"/></svg>
      Kontynuuj z Google
    </button>
    <div class="acct__or label">albo</div>

    <form class="acct__form" id="magicForm">
      <label class="sr-only" for="email">E-mail</label>
      <input id="email" type="email" placeholder="twoj@email.pl" required autocomplete="email">
      <button class="btn btn--acc" type="submit">Wyślij link logowania</button>
    </form>
    <p class="acct__msg mono" id="msg" hidden></p>
    <p class="label">Nie masz jeszcze produktów? <a href="/#cennik">Zobacz cennik</a> · <a href="/#tracker">Investor Tracker za 0 zł</a></p>
  </section>
</main>

<footer class="footer label">
  <span>© 2026 UNNPC · unnpc.com</span>
  <nav><a href="regulamin.html">Regulamin</a><a href="prywatnosc.html">Prywatność</a><a href="zwroty.html">Zwroty</a><a href="mailto:[EMAIL_WSPARCIA]">Kontakt</a></nav>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20260914"></script>
<script src="js/account.js?v=20260914"></script>
<script>
(async function () {
  const sb = window.UNNPC.sb;
  const msg = document.getElementById('msg');
  const say = (t, ok) => { msg.hidden = false; msg.textContent = t; msg.style.color = ok ? 'var(--acc)' : 'var(--danger)'; };
  const params = new URLSearchParams(location.search);
  const next = params.get('next') === 'biblioteka' ? 'biblioteka.html' : 'biblioteka.html';
  if (params.get('email')) document.getElementById('email').value = params.get('email');

  if (!sb) { say('Logowanie jeszcze nie jest podłączone (brak konfiguracji Supabase).', false); return; }

  const { data } = await sb.auth.getSession();
  if (data.session) { location.replace(next); return; }
  sb.auth.onAuthStateChange((ev, session) => { if (session) location.replace(next); });

  document.getElementById('magicForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + '/' + next } });
    if (error) say('Nie udało się wysłać linku: ' + error.message, false);
    else say('Link wysłany. Sprawdź skrzynkę (i spam) — ważny 1 godzinę.', true);
  });

  document.getElementById('googleBtn').addEventListener('click', async () => {
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/' + next } });
    if (error) say('Google: ' + error.message, false);
  });
})();
</script>
</body>
</html>
